<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" role="img" aria-label="Hoberg Tools logo">
  <title>Hoberg Tools — by Hoberg Digital Agency</title>
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8001C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0000F;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Drop icon mark (teardrop / H mark) -->
  <path d="M46 6 C46 6, 74 38, 74 60 C74 77, 62 92, 46 92 C30 92, 18 77, 18 60 C18 38, 46 6, 46 6 Z"
        fill="url(#dropGrad)" filter="url(#glow)"/>
  <!-- Play triangle cutout -->
  <path d="M37 46 L65 62 L37 78 Z" fill="#0E0B08" opacity="0.88"/>
  <!-- Gold accent underline bar -->
  <rect x="18" y="95" width="56" height="2.5" fill="#D4A843" rx="1.25"/>

  <!-- Wordmark: "Hoberg" white + " Tools" red -->
  <text x="92" y="60"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="42" font-weight="700" letter-spacing="-1" fill="#FFFFFF">Hoberg<tspan fill="#E8001C"> Tools</tspan></text>

  <!-- Tagline sub-label in gold -->
  <text x="93" y="79"
        font-family="'DM Sans', Arial, Helvetica, sans-serif"
        font-size="10.5" font-weight="600" letter-spacing="2.5" fill="#D4A843">BY HOBERG DIGITAL AGENCY</text>
</svg>
